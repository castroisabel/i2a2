[project]
name = "desafio4-i2a2"
version = "0.1.0"
description = "Agente inteligente para consulta de arquivos CSV em linguagem natural (I2A2 - Desafio 4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.0.1",
    "chardet>=5.2.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csvagent"]
